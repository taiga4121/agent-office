<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Office</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Virtual Office</p>
          <h1>AGENT OFFICE</h1>
        </div>
        <div class="topbar-actions">
          <button id="project-list-button" type="button" class="project-list-button">プロジェクト一覧</button>
          <div class="status-pill">4 agents online</div>
        </div>
      </header>

      <section id="project-list-panel" class="project-list-panel hidden" aria-label="Project visibility list"></section>

      <main id="app" class="office-layout"></main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
